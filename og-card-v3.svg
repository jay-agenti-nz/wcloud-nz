<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#8fadbd"/>
      <stop offset="1" stop-color="#7b9cae"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#e3eff6"/>
      <stop offset="0.5" stop-color="#cee2ee"/>
      <stop offset="1" stop-color="#bed7e7"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.74" cy="0.24" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="puff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f6fafc"/>
      <stop offset="1" stop-color="#cfe0ea"/>
    </linearGradient>
  </defs>

  <!-- steel ground -->
  <rect width="1200" height="630" fill="url(#ground)"/>

  <!-- the sheet, as on the site -->
  <rect x="26" y="26" width="1148" height="578" rx="30" fill="url(#sky)"/>
  <rect x="26" y="26" width="1148" height="578" rx="30" fill="url(#bloom)"/>

  <!-- cloud field -->
  <g opacity="0.92">
    <g transform="translate(760 132) scale(1.15)">
      <ellipse cx="0"  cy="14" rx="54" ry="30" fill="url(#puff)"/>
      <ellipse cx="42" cy="4"  rx="42" ry="34" fill="url(#puff)"/>
      <ellipse cx="86" cy="18" rx="46" ry="26" fill="url(#puff)"/>
    </g>
    <g transform="translate(930 330) scale(0.9)">
      <ellipse cx="0"  cy="12" rx="50" ry="28" fill="url(#puff)"/>
      <ellipse cx="40" cy="2"  rx="40" ry="32" fill="url(#puff)"/>
      <ellipse cx="80" cy="16" rx="44" ry="24" fill="url(#puff)"/>
    </g>
    <g transform="translate(690 452) scale(1.35)">
      <ellipse cx="0"  cy="12" rx="52" ry="28" fill="url(#puff)"/>
      <ellipse cx="44" cy="0"  rx="44" ry="34" fill="url(#puff)"/>
      <ellipse cx="90" cy="16" rx="46" ry="26" fill="url(#puff)"/>
    </g>
    <g transform="translate(120 500) scale(0.8)" opacity="0.75">
      <ellipse cx="0"  cy="12" rx="50" ry="26" fill="url(#puff)"/>
      <ellipse cx="40" cy="2"  rx="38" ry="30" fill="url(#puff)"/>
      <ellipse cx="78" cy="14" rx="42" ry="24" fill="url(#puff)"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(88 92)">
    <path d="M0 16 C10 2,22 32,34 10 C46 -8,58 26,68 6" stroke="#4d6e80" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <text x="88" y="8"  font-family="Raleway, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="5" fill="#2a3d4a">WHITE</text>
    <text x="88" y="30" font-family="Raleway, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="5" fill="#5a7080">CLOUD</text>
  </g>

  <!-- headline -->
  <text x="88" y="286" font-family="Georgia" font-size="82" font-weight="700" fill="#2a3d4a" letter-spacing="-1.5">A proper website.</text>
  <text x="88" y="374" font-family="Georgia" font-size="82" font-weight="700" fill="#2a3d4a" letter-spacing="-1.5">Done for you.</text>

  <!-- sub -->
  <text x="88" y="436" font-family="Nunito, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#4d6e80">Websites for small business and self-employed Kiwis.</text>

  <!-- chips -->
  <g font-family="Nunito, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2a3d4a">
    <rect x="88"  y="474" width="188" height="46" rx="23" fill="#ffffff" fill-opacity="0.72"/>
    <text x="112" y="504">From NZ$299</text>
    <rect x="292" y="474" width="214" height="46" rx="23" fill="#ffffff" fill-opacity="0.72"/>
    <text x="316" y="504">Live in about a week</text>
    <rect x="522" y="474" width="176" height="46" rx="23" fill="#ffffff" fill-opacity="0.72"/>
    <text x="546" y="504">Christchurch</text>
  </g>
</svg>
