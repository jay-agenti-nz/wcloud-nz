[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# Short, sayable URL for the Google review page, so it can go in an
# email signature or be read out over the phone. 301 so the link
# equity and the browser's memory both point at Google, not at us.
# Unlisted client preview. Not in the sitemap and not linked from the
# site; the path is the only way in, plus a PIN on the page itself.
[[redirects]]
  from = "/ascendpreview"
  to = "/ascendpreview.html"
  status = 200

[[redirects]]
  from = "/review"
  to = "https://g.page/r/CalHuPdGyw9EECE/review"
  status = 301
  force = true

[[redirects]]
  from = "/card"
  to = "/card.html"
  status = 200

[[redirects]]
  from = "/intake"
  to = "/intake.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200

[[redirects]]
  from = "/marketing"
  to = "/marketing.html"
  status = 200

[[redirects]]
  from = "/restaurants"
  to = "/restaurants.html"
  status = 200

[[redirects]]
  from = "/shoot-and-create"
  to = "/shoot-and-create.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN, not DENY: DENY blocks framing by *any* page including
    # our own, which left the device mockups on /ascendpreview blank.
    # Cross-origin framing — the clickjacking case this header exists
    # for — is still refused.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/og-*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/og-*.png"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Real icon file, so the fallback request browsers and crawlers make
# for /favicon.ico stops 404ing.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type = "image/x-icon"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
