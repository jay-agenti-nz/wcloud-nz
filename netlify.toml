[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# peelie.wcloud.nz: the addresses the Peelie app and its App Store listing
# link to. Only these three are mapped (shown in place, not redirected), so
# the rest of the subdomain stays free for the app's passkey file and
# QR-code links later. Needs peelie.wcloud.nz added as a domain alias in
# Netlify and a DNS record in Cloudflare.
[[redirects]]
  from = "https://peelie.wcloud.nz/"
  to = "/peelieapp/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://peelie.wcloud.nz/privacy"
  to = "/peelieapp/privacy/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://peelie.wcloud.nz/support"
  to = "/peelieapp/support/index.html"
  status = 200
  force = true

# Short, sayable URL for the Google review page, so it can go in an
# email signature or be read out over the phone. 301 so the link
# equity and the browser's memory both point at Google, not at us.
[[redirects]]
  from = "/review"
  to = "https://g.page/r/CalHuPdGyw9EECE/review"
  status = 301
  force = true

# Jay's photography gallery lives at /jaygallery; the short and
# possessive spellings people are likely to type land there too.
[[redirects]]
  from = "/jaysgallery"
  to = "/jaygallery"
  status = 301
  force = true

[[redirects]]
  from = "/jay"
  to = "/jaygallery"
  status = 301
  force = true

[[redirects]]
  from = "/card"
  to = "/card.html"
  status = 200

[[redirects]]
  from = "/intake"
  to = "/intake.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200

[[redirects]]
  from = "/websites"
  to = "/websites.html"
  status = 200

[[redirects]]
  from = "/marketing"
  to = "/marketing.html"
  status = 200

[[redirects]]
  from = "/restaurants"
  to = "/restaurants.html"
  status = 200

[[redirects]]
  from = "/shoot-and-create"
  to = "/shoot-and-create.html"
  status = 200

# Peelie (the café stamp-card app) lives in /peelieapp. These serve the
# folder pages at the exact addresses given to Apple (no trailing slash),
# and send the shorter /peelie spelling there too.
[[redirects]]
  from = "/peelie"
  to = "/peelieapp"
  status = 301
  force = true

[[redirects]]
  from = "/peelieapp"
  to = "/peelieapp/index.html"
  status = 200

[[redirects]]
  from = "/peelieapp/privacy"
  to = "/peelieapp/privacy/index.html"
  status = 200

[[redirects]]
  from = "/peelieapp/support"
  to = "/peelieapp/support/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    # SAMEORIGIN, not DENY: DENY blocks framing by *any* page including
    # our own, which leaves same-site device mockups blank.
    # Cross-origin framing — the clickjacking case this header exists
    # for — is still refused.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# RSS feed of the gallery's newest set (rebuilt by .claude/make-gallery-feed.py)
[[headers]]
  for = "/jaygallery/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Gallery photos never change once published under a name
[[headers]]
  for = "/jaygallery/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og-*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/og-*.png"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Real icon file, so the fallback request browsers and crawlers make
# for /favicon.ico stops 404ing.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Content-Type = "image/x-icon"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
